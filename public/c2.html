<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C2 training log</title>
<!-- Standalone build: saves to this browser's localStorage. No claude.ai dependency. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FAFBFC; --ink:#18222D; --muted:#5B6875; --line:#D3D9DF;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --warn:#9A5F12; --warn-bg:#F6E8D2; --ok:#2E7D57;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#17212B; --ink:#E6EDF3; --muted:#93A1AE; --line:#2A3744;
    --accent:#5BB3D0; --accent-ink:#0B1A22; --warn:#E0A44D; --warn-bg:#2E2414; --ok:#62C08F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#17212B; --ink:#E6EDF3; --muted:#93A1AE; --line:#2A3744;
  --accent:#5BB3D0; --accent-ink:#0B1A22; --warn:#E0A44D; --warn-bg:#2E2414; --ok:#62C08F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:44px;line-height:1;font-weight:700}
h2{font-size:22px;font-weight:700;margin:26px 0 10px}
h3{font-size:17px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}

/* header */
.tr{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wkl{font:500 15px/1.2 var(--head);color:var(--muted);margin:0;text-align:right}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:14px}
.wc{position:relative;height:46px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);color:var(--muted)}
.wc i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);background:var(--accent);opacity:.3}
.wc b{position:absolute;top:6px;left:7px;font:600 13px/1 var(--head)}
.wc.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;color:var(--ink)}
.wc.dl{background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--warn) 38%,transparent) 5px 7px)}
.cap{font-size:13px;color:var(--muted);margin:8px 0 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{font:600 15px/1 var(--body);min-height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* controls */
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:84px}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px/1 var(--body);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:500 15px/1 var(--body);cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px/1 var(--body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.today:not(.on){border-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.banner{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--warn-bg);color:var(--warn);font-size:15px}
.banner b{font-weight:600}
.row2{display:flex;gap:10px;align-items:end;margin:12px 0}
.row2 label{flex:1;font-size:13px;color:var(--muted);display:block}
.row2 label input{margin-top:4px;color:var(--ink)}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tgt{font:500 14px/1 var(--head);color:var(--muted);white-space:nowrap}
.note{font-size:14px;color:var(--muted);margin:4px 0 0}
.last{font-size:14px;margin:6px 0 0;color:var(--muted)}
.up{color:var(--ok);font-weight:600}
.sets{margin-top:10px}
.cols,.srow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.cols{font-size:13px;color:var(--muted);margin-bottom:4px}
.srow{margin-bottom:8px}
.sn{font:600 14px/1 var(--head);color:var(--muted);text-align:center}
.ride{grid-template-columns:1fr 1fr}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px/1 var(--body);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.on.flag{background:var(--warn);color:var(--bg);border-color:var(--warn)}
.label{font-size:14px;font-weight:600;margin:0}

/* plan + history */
.sched{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sd{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.sd:first-child{border-top:0}
.sd.today{box-shadow:3px 0 0 var(--accent) inset}
.sd b{font:600 15px/1.3 var(--head)}
.sd span{font-size:15px}
details.day,details.hs{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font:600 20px/1 var(--head);color:var(--muted)}
details[open] summary::after{content:"\2013"}
details .in{padding:0 14px 12px}
.pl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .nm{font-weight:500}
.pl .rx{font:500 14px/1.3 var(--head);color:var(--muted);white-space:nowrap;text-align:right}
.hd{font:600 15px/1.2 var(--head)}
.ht{font-size:14px;color:var(--muted)}
.hs summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.flagtxt{color:var(--warn);font-size:13px;font-weight:600}
.hl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hl:first-child{border-top:0}
.hl span:last-child{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.del{margin-top:10px}
.empty{padding:26px 6px;text-align:center;color:var(--muted)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;max-width:520px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
input[type=number]{-moz-appearance:textfield}
input,.srow input{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tr"><h1>C2</h1><p class="wkl" id="wkLabel"></p></div>
    <div class="strip" id="strip"></div>
    <p class="cap">Sessions logged each week, out of 7 planned. The hatched week is the deload.</p>
  </header>
  <main>
    <section id="view-log"></section>
    <section id="view-plan" hidden></section>
    <section id="view-history" hidden></section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Sections">
  <button data-act="nav" data-v="log" aria-current="page">Log</button>
  <button data-act="nav" data-v="plan">Plan</button>
  <button data-act="nav" data-v="history">History</button>
</nav>

<script>
(function(){
"use strict";

/* ---------- plan data ---------- */
var DELOAD_WEEK = 6, WEEKS = 8, PLANNED = 7;

var TYPES = {
  upperA:{label:"Upper A", sub:"Push-dominant", cat:"lift"},
  lowerA:{label:"Lower A", sub:"Quad-dominant", cat:"lift"},
  spin:{label:"Easy spin", sub:"Tue, after Lower A", cat:"ride", target:"20\u201325 min at recovery pace"},
  z3:{label:"Zone 3", sub:"Wed", cat:"ride", target:"25\u201330 min steady, Zone 3"},
  upperB:{label:"Upper B", sub:"Pull-dominant", cat:"lift"},
  lowerB:{label:"Lower B", sub:"Posterior-chain-dominant", cat:"lift"},
  hiit:{label:"HIIT", sub:"Sat", cat:"ride", target:"6\u20138 rounds, 1 min hard / 2 min easy (Zone 4\u20135). Start at the low end and build."}
};
var ORDER = ["upperA","lowerA","spin","z3","upperB","lowerB","hiit"];
var BY_DAY = {1:"upperA",2:"lowerA",3:"z3",4:"upperB",5:"lowerB",6:"hiit"};

var EX = {
  upperA:[
    {id:"chest_press",name:"Dumbbell chest press",sets:[3,4],reps:"8\u201310",repMax:10,kind:"wr"},
    {id:"shoulder_press",name:"Dumbbell shoulder press",sets:[3,3],reps:"8\u201310",repMax:10,kind:"wr",note:"Hold at 15 lb until stable, then progress."},
    {id:"incline_press",name:"Incline or floor press",sets:[3,3],reps:"10\u201312",repMax:12,kind:"wr"},
    {id:"lateral_raise",name:"Lateral raises",sets:[2,3],reps:"12\u201315",repMax:15,kind:"wr"},
    {id:"triceps",name:"Triceps pushdown or overhead extension",sets:[3,3],reps:"10\u201312",repMax:12,kind:"wr"},
    {id:"leg_raise",name:"Hanging leg raise or cable crunch",sets:[3,3],reps:"12\u201315",kind:"wr",noflag:true,note:"Core: anti-extension."}
  ],
  lowerA:[
    {id:"goblet_squat",name:"Goblet or dumbbell squat",sets:[3,4],reps:"8\u201310",repMax:10,kind:"wr"},
    {id:"leg_press",name:"Leg press",sets:[3,3],reps:"10\u201312",repMax:12,kind:"wr",note:"Walking lunges if the machine is taken."},
    {id:"leg_ext",name:"Leg extension",sets:[2,3],reps:"12\u201315",repMax:15,kind:"wr"},
    {id:"farmer",name:"Farmer carries",sets:[3,3],kind:"carry",target:"3\u00d730\u201340 m",note:"Grip."},
    {id:"plank",name:"Weighted plank or ab wheel rollout",sets:[3,3],kind:"hold",target:"3\u00d730\u201345 s (rollout 3\u00d78\u201310)",note:"Core: anti-flexion. For the ab wheel, put reps in the notes."},
    {id:"calf_stand",name:"Standing calf raise",sets:[3,3],reps:"12\u201315",repMax:15,kind:"wr"}
  ],
  upperB:[
    {id:"pulldown",name:"Lat pulldown",sets:[3,4],reps:"8\u201310",repMax:10,kind:"wr",note:"Before rows."},
    {id:"row",name:"Dumbbell rows",sets:[3,3],reps:"8\u201310",repMax:10,kind:"wr",note:"Use straps."},
    {id:"face_pull",name:"Face pulls or rear delt flyes",sets:[2,3],reps:"12\u201315",repMax:15,kind:"wr"},
    {id:"curl",name:"Dumbbell bicep curls",sets:[2,3],reps:"10\u201312",repMax:12,kind:"wr"},
    {id:"dead_hang",name:"Dead hangs",sets:[3,3],kind:"hold",target:"3\u00d7 max hold",note:"Grip."},
    {id:"pallof",name:"Pallof press",sets:[3,3],reps:"10\u201312",kind:"wr",noflag:true,note:"Core: anti-rotation. Same numbers each side."}
  ],
  lowerB:[
    {id:"rdl",name:"Dumbbell RDL",sets:[3,4],reps:"8\u201310",repMax:10,kind:"wr",note:"Back watch: end the set if your low back takes over."},
    {id:"hip_thrust",name:"Hip thrust",sets:[3,3],reps:"10\u201312",repMax:12,kind:"wr"},
    {id:"leg_curl",name:"Leg curl",sets:[2,3],reps:"12\u201315",repMax:15,kind:"wr"},
    {id:"side_plank",name:"Side plank",sets:[2,3],kind:"hold",target:"2\u20133\u00d720\u201330 s per side",note:"Core: anti-lateral-flexion."},
    {id:"calf_seated",name:"Seated calf raise",sets:[3,3],reps:"12\u201315",repMax:15,kind:"wr"}
  ]
};
var COLS = {wr:["lb","reps"], hold:["+lb (optional)","sec"], carry:["lb","meters"]};

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function pad(n){return (n<10?"0":"")+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtDate(s){return parseD(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
function target(ex){
  if(ex.target) return ex.target;
  var s=ex.sets[0]===ex.sets[1]?String(ex.sets[0]):ex.sets[0]+"\u2013"+ex.sets[1];
  return s+"\u00d7"+ex.reps;
}

/* ---------- state ---------- */
var db=null, dbState="loading";
var sessions=[], sigSessions="";
var dbStart=null, localStart=lsGet("c2.start");
var view="log";
var drafts=loadDrafts();
var cur=BY_DAY[new Date().getDay()]||null;
var armedDelete=null;
var saving=false;

function start(){return dbStart||localStart||null}
function weekOf(ds){
  var s=start(); if(!s) return null;
  var diff=Math.round((parseD(ds)-parseD(s))/864e5);
  return Math.floor(diff/7)+1;
}
function loadDrafts(){
  try{
    var o=JSON.parse(lsGet("c2.drafts")||"{}"), t=todayStr();
    Object.keys(o).forEach(function(k){if(!o[k]||o[k].created!==t) delete o[k]});
    return o;
  }catch(e){return {}}
}
function saveDrafts(){lsSet("c2.drafts",JSON.stringify(drafts))}
function draftFor(t){
  if(!drafts[t]) drafts[t]={created:todayStr(),date:todayStr(),sets:{},back:null,notes:"",minutes:"",rounds:""};
  return drafts[t];
}
function rowsFor(ex,d){
  if(!d.sets[ex.id]){
    var n=weekOf(d.date)===DELOAD_WEEK?2:ex.sets[0];
    d.sets[ex.id]=[];
    for(var i=0;i<n;i++) d.sets[ex.id].push({a:"",b:""});
  }
  return d.sets[ex.id];
}
function lastOf(type){
  for(var i=0;i<sessions.length;i++) if(sessions[i].type===type) return sessions[i];
  return null;
}
function fmtRows(ex,rows){
  return rows.map(function(r){
    var a=r[0]==null?"\u2013":r[0], b=r[1]==null?"\u2013":r[1];
    if(ex.kind==="hold") return (r[0]?"+"+r[0]+" lb ":"")+b+" s";
    if(ex.kind==="carry") return a+" lb \u00d7 "+b+" m";
    return a+"\u00d7"+b;
  }).join("  ");
}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show")},2600);
}

/* ---------- header ---------- */
function renderHeader(){
  var s=start(), label;
  if(!s) label="Start date not set";
  else{
    var w=weekOf(todayStr());
    if(w<1){var n=Math.round((parseD(s)-parseD(todayStr()))/864e5);label="Starts in "+n+(n===1?" day":" days")}
    else if(w>WEEKS) label="Block complete";
    else label="Week "+w+" of "+WEEKS+(w===DELOAD_WEEK?", deload":"");
  }
  $("#wkLabel").textContent=label;
  var counts={}; sessions.forEach(function(x){var w=weekOf(x.date); if(w>=1&&w<=WEEKS) counts[w]=(counts[w]||0)+1});
  var nowW=s?weekOf(todayStr()):null, h="";
  for(var n2=1;n2<=WEEKS;n2++){
    var p=Math.min((counts[n2]||0)/PLANNED,1);
    h+='<div class="wc'+(n2===nowW?" now":"")+(n2===DELOAD_WEEK?" dl":"")+'" style="--p:'+p+'" title="Week '+n2+': '+(counts[n2]||0)+' logged"><i></i><b>'+n2+'</b></div>';
  }
  $("#strip").innerHTML=h;
}

/* ---------- log view ---------- */
function renderLog(){
  var el=$("#view-log"), h="";
  if(!start()){
    h+='<div class="card"><h3>Set your start date</h3><p class="note">Week 1 begins on this date. It drives the week strip and the deload reminder.</p>'+
       '<div class="row2"><label>Block start<input type="date" data-f="start"></label></div>'+
       '<button class="btn" data-act="startToday">Start today</button></div>';
  }
  if(dbState==="off"){
    h+='<div class="banner">Saving is unavailable in this view. Open the page from claude.ai while signed in to log sessions. The plan still works.</div>';
  }
  var today=BY_DAY[new Date().getDay()];
  h+='<div class="chips">'+ORDER.map(function(t){
    return '<button class="chip'+(t===cur?" on":"")+(t===today?" today":"")+'" data-act="type" data-t="'+t+'">'+TYPES[t].label+'</button>';
  }).join("")+'</div>';

  if(!cur){
    h+='<div class="empty">Sunday is a rest day. Pick a session above if you want to log one anyway.</div>';
    el.innerHTML=h; return;
  }
  var T=TYPES[cur], d=draftFor(cur), wk=weekOf(d.date), deload=wk===DELOAD_WEEK;

  if(sessions.length && sessions[0].back>=1){
    h+='<div class="banner"><b>Back flagged on '+fmtDate(sessions[0].date)+'.</b> If it shows up again in weeks 4\u20135, pull the deload forward instead of waiting for week 6.</div>';
  }
  if(deload){
    h+='<div class="banner"><b>Deload week.</b> Same exercises, 2 sets, and either about 20% lighter or 15\u201320 reps. Keep it easy.</div>';
  }
  h+='<div class="row2"><label>Date<input type="date" data-f="date" value="'+esc(d.date)+'"></label>'+
     (wk?'<div class="muted" style="padding-bottom:12px">Week '+wk+'</div>':'')+'</div>';

  if(T.cat==="lift"){
    var last=lastOf(cur);
    if(last && !deload){
      h+='<button class="ghost" data-act="fill" style="width:100%">Copy numbers from last '+T.label+'</button>';
    }
    EX[cur].forEach(function(ex){
      var rows=rowsFor(ex,d), lastRows=last&&last.sets?last.sets[ex.id]:null, c=COLS[ex.kind];
      h+='<section class="card"><div class="exhead"><h3>'+esc(ex.name)+'</h3><span class="tgt">'+esc(target(ex))+'</span></div>';
      if(ex.note) h+='<p class="note">'+esc(ex.note)+'</p>';
      if(lastRows){
        var up=!ex.noflag && ex.kind==="wr" && ex.repMax && lastRows.length>=ex.sets[0] &&
          lastRows.every(function(r){return r[1]!=null&&r[1]>=ex.repMax}) && weekOf(last.date)!==DELOAD_WEEK;
        h+='<p class="last">Last: '+esc(fmtRows(ex,lastRows))+(up?' <span class="up">Top of range. Add weight.</span>':'')+'</p>';
      }
      h+='<div class="sets"><div class="cols"><span></span><span>'+c[0]+'</span><span>'+c[1]+'</span></div>';
      rows.forEach(function(r,i){
        var pa=lastRows&&lastRows[i]&&lastRows[i][0]!=null?lastRows[i][0]:"";
        var pb=lastRows&&lastRows[i]&&lastRows[i][1]!=null?lastRows[i][1]:"";
        h+='<div class="srow"><span class="sn">'+(i+1)+'</span>'+
          '<input type="text" inputmode="decimal" autocomplete="off" data-ex="'+ex.id+'" data-i="'+i+'" data-k="a" value="'+esc(r.a)+'" placeholder="'+esc(pa)+'" aria-label="'+esc(ex.name)+' set '+(i+1)+' '+c[0]+'">'+
          '<input type="text" inputmode="decimal" autocomplete="off" data-ex="'+ex.id+'" data-i="'+i+'" data-k="b" value="'+esc(r.b)+'" placeholder="'+esc(pb)+'" aria-label="'+esc(ex.name)+' set '+(i+1)+' '+c[1]+'"></div>';
      });
      h+='</div><button class="ghost" data-act="addset" data-ex="'+ex.id+'">Add set</button></section>';
    });
  } else {
    h+='<section class="card"><h3>'+T.label+'</h3><p class="note">'+esc(T.target)+'</p>'+
       '<div class="row2" style="margin-bottom:0"><label>Minutes<input type="text" inputmode="decimal" data-f="minutes" value="'+esc(d.minutes)+'"></label>'+
       (cur==="hiit"?'<label>Rounds<input type="text" inputmode="numeric" data-f="rounds" value="'+esc(d.rounds)+'"></label>':'')+'</div></section>';
  }

  h+='<section class="card"><p class="label">Back check</p><div class="seg">'+
     [["Fine",0],["Tight",1],["Ache",2]].map(function(o){
       return '<button data-act="back" data-v="'+o[1]+'" class="'+(d.back===o[1]?"on":"")+(o[1]>0?" flag":"")+'">'+o[0]+'</button>';
     }).join("")+'</div>'+
     '<p class="label" style="margin-top:14px">Notes</p><textarea data-f="notes" placeholder="Anything worth remembering">'+esc(d.notes)+'</textarea></section>';
  h+='<button class="btn" data-act="save"'+(dbState!=="ready"||saving?" disabled":"")+'>Save session</button>';
  el.innerHTML=h;
}

/* ---------- plan view ---------- */
function renderPlan(){
  var el=$("#view-plan"), td=new Date().getDay();
  var sched=[
    [1,"Mon","Upper A","Push-dominant"],
    [2,"Tue","Lower A + easy spin","Quad-dominant, then 20\u201325 min recovery pace"],
    [3,"Wed","Zone 3 ride","25\u201330 min steady"],
    [4,"Thu","Upper B","Pull-dominant"],
    [5,"Fri","Lower B","Posterior-chain-dominant. No cycling today."],
    [6,"Sat","HIIT ride","Zone 4\u20135 intervals with recovery drops"],
    [0,"Sun","Rest",""]
  ];
  var h='<h2>Week template</h2><div class="sched">'+sched.map(function(r){
    return '<div class="sd'+(r[0]===td?" today":"")+'"><b>'+r[1]+'</b><span>'+r[2]+(r[3]?'<br><span class="muted" style="font-size:14px">'+r[3]+'</span>':'')+'</span></div>';
  }).join("")+'</div>';
  h+='<div class="row2" style="margin-top:16px"><label>Block start (Week 1)<input type="date" data-f="start" value="'+esc(start()||"")+'"></label></div>';

  h+='<h2>Lifting days</h2>';
  ["upperA","lowerA","upperB","lowerB"].forEach(function(t){
    h+='<details class="day"><summary><span><h3 style="display:inline">'+TYPES[t].label+'</h3> <span class="muted" style="font-size:14px">'+TYPES[t].sub+'</span></span></summary><div class="in">'+
      EX[t].map(function(ex){
        return '<div class="pl"><div><div class="nm">'+esc(ex.name)+'</div>'+(ex.note?'<div class="note">'+esc(ex.note)+'</div>':'')+'</div><div class="rx">'+esc(target(ex))+'</div></div>';
      }).join("")+'</div></details>';
  });

  h+='<h2>Cycling</h2><div class="card">'+
     '<p><b>Tue easy spin.</b> 20\u201325 min at recovery pace, conversational, right after Lower A.</p>'+
     '<p><b>Wed Zone 3.</b> 25\u201330 min steady moderate effort.</p>'+
     '<p style="margin:0"><b>Sat HIIT.</b> 6\u20138 rounds of 1 min hard / 2 min easy. Start at the low end and build over the block.</p></div>'+
     '<p class="note">Lower B and hard cycling stay on separate days because cycling still loads the hips, and stacking it with RDLs and hip thrusts would recreate the C1 back problem. HIIT sits before Sunday so it gets full recovery.</p>';

  h+='<h2>Progression</h2><div class="card"><p>Stay 1\u20133 reps short of failure on most sets. Go closer to failure only on the last set of isolation work.</p>'+
     '<p style="margin:0">When you hit the top of the rep range on every set, add weight next session. The Log tab flags this for you.</p></div>';

  h+='<h2>Deload and back watch</h2><div class="card"><p><b>Week 6 deload.</b> Same exercises, 2 sets, and either about 20% lighter or 15\u201320 reps. Ease and shorten the HIIT too. Fatigue from the new patterns (RDL, hip thrust, carries, hangs) builds over 4\u20136 weeks, and week 6 leaves two weeks to finish strong before C3.</p>'+
     '<p style="margin:0"><b>Early warning.</b> If low-back tightness or ache appears in weeks 4\u20135, pull the deload forward instead of waiting.</p></div>';

  h+='<h2>Why rowing is out</h2><div class="card"><p style="margin:0">Back pain showed up around week 7 of C1 and cleared during the gym closure. Rowing repeats a loaded hip hinge, which stacks with the RDLs and hip thrusts in C2. The mountain bike replaces it.</p></div>';
  el.innerHTML=h;
}

/* ---------- history view ---------- */
function renderHistory(){
  var el=$("#view-history");
  if(!sessions.length){
    el.innerHTML='<div class="empty">No sessions yet. Log one from the Log tab.</div>'+backupBar();
    return;
  }
  var backTxt=["","Back tight","Back ache"];
  el.innerHTML='<h2>History</h2>'+sessions.map(function(s){
    var T=TYPES[s.type]||{label:s.type}, w=weekOf(s.date), body="";
    if(s.sets && EX[s.type]){
      EX[s.type].forEach(function(ex){
        if(s.sets[ex.id]) body+='<div class="hl"><span>'+esc(ex.name)+'</span><span>'+esc(fmtRows(ex,s.sets[ex.id]))+'</span></div>';
      });
    } else {
      body+='<div class="hl"><span>Ride</span><span>'+esc(s.minutes)+' min'+(s.rounds!=null?", "+esc(s.rounds)+" rounds":"")+'</span></div>';
    }
    if(s.notes) body+='<p class="note" style="margin-top:8px">'+esc(s.notes)+'</p>';
    var armed=armedDelete===s.id;
    return '<details class="hs"><summary><div><span class="hd">'+fmtDate(s.date)+'</span><span class="ht">'+esc(T.label)+(w>=1&&w<=WEEKS?", week "+w:"")+'</span></div>'+
      (s.back>=1?'<span class="flagtxt">'+backTxt[s.back]+'</span>':'')+'</summary><div class="in">'+body+
      '<button class="ghost del" data-act="del" data-id="'+esc(s.id)+'">'+(armed?"Tap again to delete":"Delete session")+'</button></div></details>';
  }).join("")+backupBar();
}

function backupBar(){
  return '<h2>Backup</h2><div class="card"><p class="note" style="margin-top:0">Sessions are stored in this browser on this device. Export a backup now and then, especially before clearing browser data.</p>'+
    '<div style="display:flex;gap:10px"><button class="ghost" data-act="export" style="flex:1">Export backup</button><button class="ghost" data-act="import" style="flex:1">Import backup</button></div>'+
    '<input type="file" id="importFile" accept="application/json,.json" data-f="import" hidden></div>';
}

function renderAll(){
  renderHeader(); renderHistory(); renderPlan();
  var a=document.activeElement;
  var typing=a && a.closest && a.closest("#view-log") && /INPUT|TEXTAREA/.test(a.tagName);
  if(!typing) renderLog();
}
function showView(v){
  view=v;
  ["log","plan","history"].forEach(function(n){$("#view-"+n).hidden=(n!==v)});
  document.querySelectorAll("nav button").forEach(function(b){
    if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}

/* ---------- actions ---------- */
async function setStart(v){
  if(!v) return;
  lsSet("c2.start",v); localStart=v;
  try{ if(db) await db.doc("config/c2").set({startDate:v}); }
  catch(e){ toast("Couldn't sync the start date"); }
  renderAll();
}
function fillFromLast(){
  var last=lastOf(cur); if(!last||!last.sets) return;
  var d=draftFor(cur);
  EX[cur].forEach(function(ex){
    var src=last.sets[ex.id]; if(!src) return;
    var rows=rowsFor(ex,d);
    src.forEach(function(r,i){
      if(!rows[i]) rows[i]={a:"",b:""};
      if(rows[i].a===""&&r[0]!=null) rows[i].a=String(r[0]);
      if(rows[i].b===""&&r[1]!=null) rows[i].b=String(r[1]);
    });
  });
  saveDrafts(); renderLog();
}
async function save(){
  if(!db||!cur||saving) return;
  var d=draftFor(cur), T=TYPES[cur];
  var doc={type:cur,date:d.date,ts:Date.now(),back:d.back,notes:(d.notes||"").trim()};
  if(T.cat==="lift"){
    var sets={}, n=0;
    EX[cur].forEach(function(ex){
      var rows=(d.sets[ex.id]||[]).filter(function(r){return r.a!==""||r.b!==""}).map(function(r){return [num(r.a),num(r.b)]});
      if(rows.length){sets[ex.id]=rows;n+=rows.length}
    });
    if(!n){toast("Add at least one set first");return}
    doc.sets=sets;
  } else {
    var m=num(d.minutes);
    if(!(m>0)){toast("Add the ride length in minutes");return}
    doc.minutes=m;
    if(cur==="hiit"&&num(d.rounds)!=null) doc.rounds=num(d.rounds);
  }
  saving=true; renderLog();
  try{
    await db.collection("sessions").add(doc);
    delete drafts[cur]; saveDrafts();
    toast("Session saved");
  }catch(e){
    toast("Couldn't save ("+((e&&e.code)||"error")+"). Your entries are still here.");
  }
  saving=false; renderLog();
}
async function del(id){
  if(!db) return;
  if(armedDelete!==id){armedDelete=id;renderHistory();return}
  armedDelete=null;
  try{ await db.doc("sessions/"+id).delete(); toast("Session deleted"); }
  catch(e){ toast("Couldn't delete ("+((e&&e.code)||"error")+")"); renderHistory(); }
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.dataset.act;
  if(act==="nav") showView(b.dataset.v);
  else if(act==="type"){cur=b.dataset.t;renderLog()}
  else if(act==="addset"){
    var ex=null; EX[cur].forEach(function(x){if(x.id===b.dataset.ex) ex=x});
    if(ex){rowsFor(ex,draftFor(cur)).push({a:"",b:""});saveDrafts();renderLog()}
  }
  else if(act==="back"){var d=draftFor(cur),v=+b.dataset.v;d.back=(d.back===v)?null:v;saveDrafts();renderLog()}
  else if(act==="fill") fillFromLast();
  else if(act==="save") save();
  else if(act==="startToday") setStart(todayStr());
  else if(act==="del") del(b.dataset.id);
  else if(act==="export") exportBackup();
  else if(act==="import") $("#importFile").click();
});
document.addEventListener("input",function(e){
  var t=e.target, d=cur&&drafts[cur];
  if(t.dataset.ex&&d){ d.sets[t.dataset.ex][+t.dataset.i][t.dataset.k]=t.value; saveDrafts(); }
  else if(t.dataset.f&&d&&t.dataset.f!=="start"&&t.dataset.f!=="date"&&t.dataset.f!=="import"){ d[t.dataset.f]=t.value; saveDrafts(); }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.f==="start") setStart(t.value);
  else if(t.dataset.f==="import") importBackup(t.files&&t.files[0]);
  else if(t.dataset.f==="date"&&cur&&t.value){ var d=draftFor(cur); d.date=t.value; saveDrafts(); renderLog(); }
});

/* ---------- local storage backend (replaces claude.ai's db) ---------- */
var LOCAL=null;
function localDb(){
  var KEY="c2.db.v1", subs=[];
  function load(){
    try{var o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.sessions&&o.config) return o}catch(e){}
    return {sessions:{},config:{}};
  }
  function store(o){localStorage.setItem(KEY,JSON.stringify(o))}
  function notify(){subs.slice().forEach(function(f){f()})}
  function sub(f){subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}}
  function qsnap(){
    var o=load();
    var docs=Object.keys(o.sessions).map(function(id){var v=o.sessions[id];return {id:id,data:function(){return JSON.parse(JSON.stringify(v))}}});
    docs.sort(function(a,b){return (b.data().ts||0)-(a.data().ts||0)});
    return {docs:docs};
  }
  var api={
    collection:function(){
      var q={
        orderBy:function(){return q}, limit:function(){return q},
        onSnapshot:function(next){return sub(function(){next(qsnap())})},
        add:function(data){
          var o=load(), id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          o.sessions[id]=data; store(o); notify();
          return Promise.resolve({id:id});
        }
      };
      return q;
    },
    doc:function(path){
      var p=path.split("/");
      if(p[0]==="sessions") return {delete:function(){var o=load();delete o.sessions[p[1]];store(o);notify();return Promise.resolve()}};
      return {
        set:function(data){var o=load();o.config[p[1]]=data;store(o);notify();return Promise.resolve()},
        onSnapshot:function(next){return sub(function(){var v=load().config[p[1]];next({exists:!!v,data:function(){return v}})})}
      };
    },
    exportAll:function(){var o=load();return {app:"c2-log",version:1,exported:new Date().toISOString(),sessions:o.sessions,config:o.config}},
    importAll:function(inb){
      if(!inb||typeof inb.sessions!=="object") throw new Error("bad backup");
      var o=load(), n=0;
      Object.keys(inb.sessions).forEach(function(id){if(!o.sessions[id]){o.sessions[id]=inb.sessions[id];n++}});
      if(inb.config&&inb.config.c2&&!o.config.c2) o.config.c2=inb.config.c2;
      store(o); notify(); return n;
    }
  };
  return api;
}
function exportBackup(){
  try{
    var blob=new Blob([JSON.stringify(LOCAL.exportAll(),null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="c2-backup-"+todayStr()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  }catch(e){toast("Couldn't export the backup")}
}
function importBackup(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    try{var n=LOCAL.importAll(JSON.parse(r.result)); toast("Imported "+n+(n===1?" session":" sessions"))}
    catch(e){toast("That file isn't a valid backup")}
  };
  r.readAsText(file);
}

/* ---------- boot ---------- */
renderAll(); showView("log");

(async function(){
  try{
    var d=localDb(); LOCAL=d;
    db=d; dbState="ready";
    db.collection("sessions").orderBy("ts","desc").limit(500).onSnapshot(function(snap){
      var next=snap.docs.map(function(x){var o=x.data();o.id=x.id;return o});
      var sig=JSON.stringify(next);
      if(sig!==sigSessions){sessions=next;sigSessions=sig}
      renderAll();
    },function(err){toast("Couldn't load sessions ("+((err&&err.code)||"error")+")")});
    db.doc("config/c2").onSnapshot(function(s){
      var v=s.exists?s.data():null;
      var ns=v&&v.startDate?v.startDate:null;
      if(ns!==dbStart){dbStart=ns;renderAll()}
    },function(){});
    renderAll();
  }catch(e){ dbState="off"; renderAll(); }
})();
})();
</script>
